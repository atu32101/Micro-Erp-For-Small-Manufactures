{% extends "base.html" %}

{% block title %}{% if product %}Edit{% else %}Add{% endif %} Product - Micro ERP{% endblock %}
{% block header %}{% if product %}Edit{% else %}Add{% endif %} Product{% endblock %}

{% block content %}
<div class="form-container">
    <form method="POST" action="" class="data-form">
        <div class="form-group">
            <label for="name">Product Name</label>
            <input type="text" id="name" name="name" required value="{{ product.name if product else '' }}" placeholder="Enter product name">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" required min="0" value="{{ product.quantity if product else '0' }}" placeholder="0">
            </div>
            
            <div class="form-group">
<label for="price">Price (₹)</label>
                <input type="number" id="price" name="price" required min="0" step="0.01" value="{{ product.price if product else '0.00' }}" placeholder="0.00">
            </div>
        </div>
        
        <div class="form-group">
            <label for="supplier_id">Supplier</label>
            <select id="supplier_id" name="supplier_id">
                <option value="">-- Select Supplier --</option>
                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}" {% if product and product.supplier_id == supplier.id %}selected{% endif %}>
                    {{ supplier.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if product %}Update{% else %}Add{% endif %} Product</button>
            <a href="{{ url_for('products') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
