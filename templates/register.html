{% extends "base.html" %}

{% block title %}Register - Micro ERP{% endblock %}

{% block login_content %}
<div class="login-box">
    <div class="login-header">
        <h2>Register</h2>
        <p>Create New Account</p>
    </div>
    
    {% if step == 1 %}
    <!-- Step 1: Registration Details -->
    <form method="POST" action="{{ url_for('register') }}" class="login-form">
        <input type="hidden" name="step" value="1">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
                <option value="">Select Role</option>
                <option value="staff">Staff</option>
                <option value="manager">Manager</option>
            </select>
        </div>
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" required placeholder="Enter mobile number (e.g., +919999999999)">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send OTP</button>
    </form>
    {% elif step == 2 %}
    <!-- Step 2: OTP Verification -->
    <form method="POST" action="{{ url_for('register') }}" class="login-form">
        <input type="hidden" name="step" value="2">
        <input type="hidden" name="username" value="{{ username }}">
        <input type="hidden" name="name" value="{{ name }}">
        <input type="hidden" name="dob" value="{{ dob }}">
        <input type="hidden" name="role" value="{{ role }}">
        <input type="hidden" name="mobile" value="{{ mobile }}">
        <input type="hidden" name="password" value="{{ password }}">
        
        <div class="form-group">
            <label for="otp">Enter OTP sent to {{ mobile }}</label>
            <input type="text" id="otp" name="otp" required placeholder="Enter 6-digit OTP" maxlength="6" pattern="[0-9]{6}">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Verify & Register</button>
        <a href="{{ url_for('resend_register_otp') }}" class="btn btn-link btn-block">Resend OTP</a>
    </form>
    {% endif %}
    
    <div class="login-footer">
        <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
