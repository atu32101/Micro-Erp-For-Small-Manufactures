{% extends "base.html" %}

{% block title %}Add Supplier - Micro ERP{% endblock %}
{% block header %}Add Supplier{% endblock %}

{% block content %}
<div class="form-container">
    <form method="POST" action="" class="data-form">
        <div class="form-group">
            <label for="name">Supplier Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter supplier name">
        </div>
        
        <div class="form-group">
            <label for="contact">Contact Person</label>
            <input type="text" id="contact" name="contact" placeholder="Enter contact person name">
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter email address">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" placeholder="Enter phone number">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Supplier</button>
            <a href="{{ url_for('suppliers') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
