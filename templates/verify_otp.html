{% extends "base.html" %}

{% block title %}Verify OTP - Micro ERP{% endblock %}

{% block login_content %}
<div class="login-box">
    <div class="login-header">
        <h2>Verify OTP</h2>
        <p>Enter the code sent to your email</p>
    </div>
    <form method="POST" action="{{ url_for('verify_otp') }}" class="login-form">
        <div class="form-group">
            <label for="otp">One-Time Password</label>
            <input type="text" id="otp" name="otp" required placeholder="Enter 6-digit OTP" maxlength="6" pattern="[0-9]{6}">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Verify OTP</button>
    </form>
    <div class="login-footer">
        <p>Didn't receive OTP? <a href="{{ url_for('resend_otp') }}">Resend OTP</a></p>
        <p><a href="{{ url_for('logout') }}">Cancel and go back</a></p>
    </div>
</div>
{% endblock %}
